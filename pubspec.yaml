name: bahanap_admin_application
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^8.2.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_auth: ^6.0.0
  provider: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Gilroy
      fonts:
        - asset: fonts/Gilroy-Bold.ttf
        - asset: fonts/Gilroy-Heavy.ttf
    - family: SFPro
      fonts:
        - asset: fonts/SFPRODISPLAYREGULAR.otf
